<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speakout B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8FAFC;--card:#fff;--border:#E2E8F0;--text:#0F172A;--accent:#4F46E5;--tint:#EEF2FF;--green:#BBF7D0;--gt:#166534;--pink:#FBCFE8;--pt:#9D174D;--muted:#64748B;--r:16px;--sh:0 1px 3px rgba(15,23,42,.06)}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:"Plus Jakarta Sans",sans-serif}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 3rem}
header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.75rem}
.brand h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
.brand p{color:var(--muted);font-size:.9rem;margin-top:.15rem}
.name-box{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.name-box input{min-width:180px;height:44px;padding:0 .9rem;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}
.name-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.saved{font-size:.75rem;color:var(--gt);background:var(--green);padding:.2rem .55rem;border-radius:999px;opacity:0;transition:opacity .2s}
.saved.on{opacity:1}
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:1.1rem 1.25rem;margin-bottom:1.5rem}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;font-size:.9rem}
.prog-top strong{font-weight:600}
.bar{height:8px;background:#E2E8F0;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .35s ease}
.continue{display:none;margin-top:.85rem}
.continue a{display:inline-flex;align-items:center;gap:.4rem;height:40px;padding:0 1rem;background:var(--tint);color:var(--accent);font-weight:600;font-size:.875rem;border-radius:10px;border:1px solid #C7D2FE}
.continue a:hover{background:#E0E7FF}
.units{display:grid;gap:1.25rem}
.unit{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:1.1rem 1.15rem}
.unit h2{font-size:1.05rem;font-weight:700;margin-bottom:.75rem;letter-spacing:-.01em}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.55rem}
.lesson{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;padding:.5rem .35rem;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:center;transition:border-color .15s,background .15s,box-shadow .15s;cursor:pointer}
.lesson:hover{border-color:#A5B4FC;background:var(--tint);box-shadow:0 0 0 1px #C7D2FE}
.lesson:active{transform:scale(.97)}
.lesson .id{font-weight:700;font-size:.95rem;letter-spacing:.02em}
.lesson .ttl{font-size:.65rem;color:var(--muted);margin-top:.1rem;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{margin-top:.3rem;font-size:.65rem;font-weight:600;padding:.12rem .4rem;border-radius:999px;background:#F1F5F9;color:var(--muted)}
.lesson.empty .pill{background:#F1F5F9;color:var(--muted)}
.lesson.prog .pill{background:var(--tint);color:var(--accent)}
.lesson.done .pill{background:var(--green);color:var(--gt)}
.lesson.done{border-color:#86EFAC}
.lesson.prog{border-color:#A5B4FC}
footer{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;font-size:.8rem;color:var(--muted)}
footer button{height:40px;padding:0 .9rem;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;font-size:.8rem}
footer button:hover{border-color:#F9A8D4;color:var(--pt);background:#FDF2F8}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(120%);background:#0F172A;color:#fff;padding:.65rem 1.1rem;border-radius:12px;font-size:.85rem;display:flex;align-items:center;gap:.75rem;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;transition:transform .25s ease}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{background:transparent;border:none;color:#A5B4FC;font-weight:600;cursor:pointer;padding:.2rem .4rem}
@media(min-width:640px){.lessons{grid-template-columns:repeat(5,1fr)}.lesson{min-height:80px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">
<h1>Speakout B2</h1>
<p>Upper Intermediate · 12 units · 60 lessons</p>
</div>
<div class="name-box">
<input id="nameIn" type="text" placeholder="Type full name" autocomplete="name" aria-label="Your name">
<span id="saved" class="saved">Saved</span>
</div>
</header>
<section class="prog-card" aria-label="Overall progress">
<div class="prog-top"><strong id="pctLabel">0%</strong><span id="startedLabel">0 of 60 lessons started</span></div>
<div class="bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i id="barFill"></i></div>
<div class="continue" id="contBox"><a id="contLink" href="#">Continue where you left off →</a></div>
</section>
<div class="units" id="units"></div>
<footer>
<button type="button" id="resetBtn">Reset all progress</button>
<span>Speakout B2 · local progress only</span>
</footer>
</div>
<div class="toast" id="toast" role="status"><span>Progress cleared</span><button type="button" id="undoBtn">Undo</button></div>
<script>
(function(){
const IDS=[];
for(let u=1;u<=12;u++)['A','B','C','D','R'].forEach(l=>IDS.push(u+l));
const TITLES={};
IDS.forEach(id=>{TITLES[id]=id});
const NAME_KEY='speakout_b2_name';
const PREFIX='speakout_b2_state_';
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeRm(k){try{localStorage.removeItem(k)}catch(e){}}
function loadState(id){
const raw=safeGet(PREFIX+id);
if(!raw)return{p:0,ts:0};
try{const o=JSON.parse(raw);const p=Math.max(0,Math.min(100,Number(o.percent??o.progress??o.p??0)||0));const ts=Number(o.lastModified??o.ts??0)||0;return{p,ts}}catch(e){return{p:0,ts:0}}
}
const nameIn=document.getElementById('nameIn');
const savedEl=document.getElementById('saved');
nameIn.value=safeGet(NAME_KEY)||'';
let saveT;
nameIn.addEventListener('input',()=>{
clearTimeout(saveT);
saveT=setTimeout(()=>{safeSet(NAME_KEY,nameIn.value.trim());savedEl.classList.add('on');setTimeout(()=>savedEl.classList.remove('on'),1200)},280);
});
const unitsEl=document.getElementById('units');
let totalP=0,started=0,best={id:null,ts:0};
const frag=document.createDocumentFragment();
for(let u=1;u<=12;u++){
const card=document.createElement('section');
card.className='unit';
card.innerHTML='<h2>Unit '+u+'</h2>';
const grid=document.createElement('div');
grid.className='lessons';
['A','B','C','D','R'].forEach(l=>{
const id=u+l;
const st=loadState(id);
totalP+=st.p;
if(st.p>0||safeGet(PREFIX+id))started++;
if(st.ts>best.ts){best={id,ts:st.ts}}
const a=document.createElement('a');
a.href='lesson.html?unit='+id;
a.className='lesson '+(st.p>=100?'done':st.p>0?'prog':'empty');
a.innerHTML='<span class="id">'+id+'</span><span class="ttl">'+TITLES[id]+'</span><span class="pill">'+(st.p|0)+'%</span>';
grid.appendChild(a);
});
card.appendChild(grid);
frag.appendChild(card);
}
unitsEl.appendChild(frag);
const avg=Math.round(totalP/60);
document.getElementById('pctLabel').textContent=avg+'%';
document.getElementById('startedLabel').textContent=started+' of 60 lessons started';
const fill=document.getElementById('barFill');
fill.style.width=avg+'%';
fill.parentElement.setAttribute('aria-valuenow',avg);
if(best.id){
const box=document.getElementById('contBox');
box.style.display='block';
document.getElementById('contLink').href='lesson.html?unit='+best.id;
}
let backup=null;
const toast=document.getElementById('toast');
document.getElementById('resetBtn').addEventListener('click',()=>{
backup={name:safeGet(NAME_KEY),states:{}};
IDS.forEach(id=>{const v=safeGet(PREFIX+id);if(v)backup.states[id]=v;safeRm(PREFIX+id)});
safeRm(NAME_KEY);
nameIn.value='';
location.reload();
});
document.getElementById('undoBtn').addEventListener('click',()=>{
if(!backup)return;
if(backup.name)safeSet(NAME_KEY,backup.name);
Object.keys(backup.states).forEach(id=>safeSet(PREFIX+id,backup.states[id]));
backup=null;
toast.classList.remove('on');
location.reload();
});
if(sessionStorage.getItem('speakout_just_reset')){
sessionStorage.removeItem('speakout_just_reset');
toast.classList.add('on');
setTimeout(()=>toast.classList.remove('on'),6000);
}
const _r=document.getElementById('resetBtn');
_r.addEventListener('click',()=>{sessionStorage.setItem('speakout_just_reset','1')},{once:true});
})();
</script>
</body>
</html>
