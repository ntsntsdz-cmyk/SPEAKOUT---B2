<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8FAFC;--card:#fff;--border:#E2E8F0;--text:#0F172A;--accent:#4F46E5;--tint:#EEF2FF;--green:#BBF7D0;--gt:#166534;--pink:#FBCFE8;--pt:#9D174D;--muted:#64748B;--r:16px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
h1,h2,h3,.heading{font-family:"Plus Jakarta Sans",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:flex;min-height:100vh}
.sidebar{width:280px;background:#fff;border-right:1px solid var(--border);padding:1rem;display:flex;flex-direction:column;gap:.75rem;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;flex-shrink:0}
.sidebar a{color:var(--accent);text-decoration:none;font-size:.875rem;font-weight:500}
.sidebar a:hover{text-decoration:underline}
.title-box h1{font-size:1.1rem;font-weight:700;line-height:1.3}
.unit-sel{width:100%;padding:.4rem .5rem;border:1px solid var(--border);border-radius:8px;margin-top:.35rem;background:#fff}
.name-card{background:var(--tint);border-radius:12px;padding:.75rem;border:1px solid #C7D2FE}
.name-card input{width:100%;border:1px solid var(--border);border-radius:8px;padding:.45rem .6rem;margin-bottom:.5rem}
.prog-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.prog-pill{background:var(--accent);color:#fff;font-size:.7rem;font-weight:600;padding:.15rem .45rem;border-radius:999px}
.prog-bar{flex:1;height:4px;background:#E0E7FF;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.saved{font-size:.7rem;color:var(--muted);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.side-btns{display:flex;gap:.5rem}
.side-btns button{flex:1;padding:.45rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff}
.side-btns button:hover{background:var(--tint)}
.sec-label{font-size:.65rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-top:.5rem}
.sec-list{list-style:none;display:flex;flex-direction:column;gap:.25rem}
.sec-list a{display:flex;align-items:center;gap:.5rem;padding:.35rem .4rem;border-radius:8px;font-size:.85rem;color:var(--text);text-decoration:none}
.sec-list a:hover,.sec-list a.active{background:var(--tint);color:var(--accent)}
.sec-list .dot{width:22px;height:22px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0}
.sec-list a.done .dot{background:var(--green);color:var(--gt)}
.sec-list a.active .dot{background:var(--accent);color:#fff}
.side-foot{margin-top:auto;padding-top:.75rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.4rem}
.btn-report{width:100%;padding:.65rem;background:var(--accent);color:#fff;border-radius:10px;font-weight:600;font-size:.9rem}
.btn-report:hover{background:#4338CA}
.btn-reset{font-size:.75rem;color:var(--muted);text-align:center}
.btn-reset:hover{color:var(--text)}
.main{flex:1;padding:1.5rem 1rem;overflow-x:hidden}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.04);max-width:860px;margin:0 auto;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#6366F1,#A855F7)}
.card-inner{padding:1.5rem 1.75rem}
.pages-pill{display:inline-block;background:#E0E7FF;color:#3730A3;font-size:.7rem;font-weight:600;padding:.2rem .55rem;border-radius:999px;margin-bottom:.75rem}
.tip-bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:#F5F3FF;border-radius:10px;cursor:pointer;margin-bottom:.75rem;border:1px solid #DDD6FE;font-size:.85rem}
.tip-bar .chev{margin-left:auto;transition:transform .2s}
.tip-bar.open .chev{transform:rotate(180deg)}
.tip-body{display:none;padding:.75rem;background:#FAF5FF;border-radius:0 0 10px 10px;margin-top:-.5rem;margin-bottom:.75rem;font-size:.85rem;border:1px solid #DDD6FE;border-top:0}
.tip-bar.open+.tip-body{display:block}
.sec-head{font-size:1.35rem;font-weight:700;padding-bottom:.4rem;border-bottom:2px solid #1E1B4B;margin-bottom:1rem}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.leg-pill{font-size:.7rem;font-weight:600;padding:.2rem .5rem;border-radius:999px}
.leg-pill.green{background:var(--green);color:var(--gt)}
.leg-pill.pink{background:var(--pink);color:var(--pt)}
.block{margin-bottom:1.25rem}
.ex-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.ex-head{background:var(--tint);padding:.6rem .9rem;display:flex;align-items:center;gap:.6rem;border-bottom:1px solid #C7D2FE}
.ex-num{background:var(--accent);color:#fff;font-size:.75rem;font-weight:700;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-inst{font-weight:600;font-size:.9rem}
.ex-body{padding:.9rem}
.read-card{background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:.85rem;margin-bottom:.6rem}
.read-sub{display:inline-block;background:#1E1B4B;color:#fff;font-size:.7rem;font-weight:600;padding:.15rem .45rem;border-radius:6px;margin-bottom:.4rem}
.hl-green{background:var(--green);color:var(--gt);font-weight:600;padding:.05rem .3rem;border-radius:4px}
.hl-pink{background:var(--pink);color:var(--pt);font-weight:600;padding:.05rem .3rem;border-radius:4px}
.rule-card{border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:.5rem}
.rule-label{display:inline-block;background:var(--tint);color:var(--accent);font-size:.7rem;font-weight:700;padding:.15rem .45rem;border-radius:6px;margin-bottom:.35rem}
.rule-ex{margin-top:.4rem;padding-left:.75rem;border-left:3px solid var(--accent);font-size:.85rem;color:var(--muted);font-style:italic}
.gap-item{margin-bottom:.85rem}
.gap-q{margin-bottom:.35rem;line-height:1.7}
.gap-input,.gap-select{display:inline-block;min-width:115px;padding:.25rem .4rem;border:1.5px solid var(--border);border-radius:6px;vertical-align:baseline;background:#fff;font-size:.95rem}
.gap-input.ok,.gap-select.ok{border-color:#16A34A;background:#F0FDF4}
.gap-input.bad,.gap-select.bad{border-color:#DC2626;background:#FEF2F2}
.gap-mark{font-weight:700;margin-left:.25rem}
.gap-mark.ok{color:#16A34A}
.gap-mark.bad{color:#DC2626}
.hint-tag{font-size:.7rem;color:var(--muted);margin-left:.2rem}
.word-box{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
.chip{background:var(--tint);border:1px solid #C7D2FE;padding:.25rem .55rem;border-radius:999px;font-size:.8rem;cursor:pointer}
.chip:hover{background:#C7D2FE}
.chip.used{opacity:.4;pointer-events:none}
.ex-actions{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.75rem}
.btn-check{background:var(--accent);color:#fff;padding:.45rem .9rem;border-radius:8px;font-weight:600;font-size:.85rem}
.btn-check:hover{background:#4338CA}
.btn-quiet{font-size:.8rem;color:var(--muted);padding:.35rem .5rem}
.btn-quiet:hover{color:var(--accent)}
.score-line{font-size:.85rem;font-weight:600;margin-left:.25rem}
.explain{font-size:.8rem;color:var(--muted);margin-top:.3rem;padding-left:.2rem}
.hint-toggle{font-size:.8rem;color:var(--accent);cursor:pointer}
.tf-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.tf-pill{padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:999px;font-size:.85rem;font-weight:500;min-width:44px;text-align:center}
.tf-pill.sel-t{background:#DCFCE7;border-color:#16A34A;color:#166534}
.tf-pill.sel-f{background:#FEE2E2;border-color:#DC2626;color:#991B1B}
.tf-pill.ok{background:#DCFCE7;border-color:#16A34A}
.tf-pill.bad{background:#FEE2E2;border-color:#DC2626}
.tf-exp{width:100%;margin-top:.3rem;display:none}
.tf-exp.open{display:block}
.tf-exp textarea{width:100%;min-height:50px;border:1px solid var(--border);border-radius:8px;padding:.4rem;resize:vertical}
.write-area{width:100%;min-height:100px;border:1px solid var(--border);border-radius:10px;padding:.6rem;resize:none;overflow:hidden}
.wc-badge{display:inline-block;font-size:.75rem;font-weight:600;padding:.15rem .45rem;border-radius:999px;background:#E2E8F0;margin-top:.4rem}
.wc-badge.ok{background:var(--green);color:var(--gt)}
.tv-row{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.tv-chip{font-size:.75rem;padding:.2rem .45rem;border-radius:6px;background:#F1F5F9;border:1px solid var(--border)}
.tv-chip.hit{background:var(--green);color:var(--gt);border-color:#86EFAC}
.speak-card details{border:1px solid var(--border);border-radius:10px;padding:.75rem}
.speak-card summary{cursor:pointer;font-weight:600}
.speak-q{margin:.5rem 0;padding-left:1rem}
.speak-notes{width:100%;min-height:70px;border:1px solid var(--border);border-radius:8px;padding:.5rem;margin-top:.5rem}
.sa-item{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem}
.sa-item input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
.img-wrap{margin:1rem 0;text-align:center}
.img-wrap img{max-width:100%;border-radius:12px;display:block;margin:0 auto}
.img-miss{border:2px dashed #CBD5E1;border-radius:12px;padding:2rem;color:var(--muted);text-align:center}
.img-cap{font-size:.8rem;color:var(--muted);margin-top:.4rem}
.audio-card{border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.75rem}
.audio-ctrls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.audio-btn{width:36px;height:36px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:1rem}
.scrub{flex:1;min-width:100px;height:4px;accent-color:var(--accent)}
.time-disp{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.speed-sel{font-size:.75rem;border:1px solid var(--border);border-radius:6px;padding:.2rem}
.trans-card{border:2px solid #6366F1;border-radius:10px;margin-top:.5rem;overflow:hidden}
.trans-head{display:flex;align-items:center;gap:.4rem;padding:.5rem .75rem;background:#EEF2FF;cursor:pointer;font-weight:700;color:#4338CA;font-size:.9rem}
.trans-body{display:none;padding:.75rem;font-size:.9rem;max-height:240px;overflow-y:auto}
.trans-card.open .trans-body{display:block}
.trans-body .spk{font-weight:700}
.dict-word{cursor:pointer;border-bottom:1px dotted var(--accent);color:inherit}
.dict-word:hover{background:var(--tint)}
.dict-pop{position:fixed;z-index:100;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:1rem;width:280px;max-width:90vw}
.dict-pop .hw{font-weight:700;color:var(--accent);font-size:1.05rem}
.dict-pop .btns{display:flex;gap:.3rem;margin:.35rem 0}
.dict-pop .btns button{width:32px;height:32px;border-radius:50%;background:var(--tint);font-size:.9rem}
.dict-pop .ipa{font-size:.85rem;margin:.25rem 0}
.dict-pop .stress{font-weight:700;color:var(--pt)}
.dict-pop .pos{display:inline-block;background:#F1F5F9;font-size:.7rem;padding:.1rem .35rem;border-radius:4px;margin-right:.3rem}
.dict-pop .ex{font-style:italic;font-size:.8rem;border-left:3px solid var(--accent);padding-left:.5rem;margin:.4rem 0;color:var(--muted)}
.dict-pop .save-btn{width:100%;padding:.45rem;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;font-size:.85rem;margin-top:.4rem}
.dict-pop .save-btn.saved{background:#16A34A}
.dict-pop .x{position:absolute;top:.4rem;right:.5rem;font-size:1.1rem;color:var(--muted)}
.complete-card{text-align:center;padding:1.5rem;background:var(--tint);border-radius:12px;margin-top:1.5rem}
.complete-card h3{font-size:1.2rem;margin-bottom:.75rem}
.btn-next{background:var(--accent);color:#fff;padding:.6rem 1.2rem;border-radius:10px;font-weight:600}
.skel{padding:1.5rem}
.skel-line{height:14px;background:#E2E8F0;border-radius:6px;margin-bottom:.6rem;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fail-card{max-width:420px;margin:3rem auto;padding:2rem;text-align:center;background:#fff;border:1px solid var(--border);border-radius:var(--r)}
.fail-card input[type=file]{margin:1rem 0}
.fail-card button{background:var(--accent);color:#fff;padding:.5rem 1rem;border-radius:8px;font-weight:600}
.burger{display:none;position:fixed;top:.75rem;left:.75rem;z-index:50;width:44px;height:44px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:1.2rem;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1E1B4B;color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:none;border-radius:16px;padding:0;max-width:520px;width:90vw;box-shadow:0 20px 40px rgba(0,0,0,.15)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-in{padding:1.25rem}
.dlg-in h2{font-size:1.15rem;margin-bottom:.75rem}
.dlg-close{float:right;font-size:1.2rem;color:var(--muted)}
.wl-search{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:8px;margin-bottom:.5rem}
.wl-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.9rem}
.wl-del{color:#DC2626;font-size:.8rem}
.rpt-sec{margin:.75rem 0;font-size:.9rem}
.rpt-btns{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.rpt-btns button{padding:.5rem .9rem;border-radius:8px;font-weight:600;font-size:.85rem}
.btn-mail{background:var(--accent);color:#fff}
.btn-copy{background:#F1F5F9;border:1px solid var(--border)}
@media(max-width:768px){
.burger{display:flex}
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.1)}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block}
.main{padding:1rem .75rem;padding-top:3.5rem}
.card-inner{padding:1.1rem}
}
</style>
</head>
<body>
<button class="burger" id="burger" aria-label="Menu">☰</button>
<div class="overlay" id="overlay"></div>
<div class="layout">
<aside class="sidebar" id="sidebar">
<a href="index.html">← Main page</a>
<div class="title-box">
<h1 id="lessonTitle">Loading…</h1>
<select class="unit-sel" id="unitSel" aria-label="Select lesson"></select>
</div>
<div class="name-card">
<input type="text" id="nameIn" placeholder="Type full name" aria-label="Your name">
<div class="prog-row"><span class="prog-pill" id="progPct">0%</span><div class="prog-bar"><div class="prog-fill" id="progFill"></div></div></div>
<span class="saved" id="savedMsg">Saved</span>
</div>
<div class="side-btns">
<button id="notesBtn">📝 Notes</button>
<button id="wordlistBtn">📖 My Wordlist</button>
</div>
<div class="sec-label">LESSON</div>
<ul class="sec-list" id="lessonSecs"></ul>
<div class="sec-label">FOCUS</div>
<ul class="sec-list" id="focusSecs"></ul>
<div class="side-foot">
<button class="btn-report" id="reportBtn">📊 Results Report</button>
<button class="btn-reset" id="resetBtn">Reset progress</button>
</div>
</aside>
<main class="main" id="main">
<div class="card"><div class="card-inner skel" id="content">
<div class="skel-line" style="width:40%"></div>
<div class="skel-line" style="width:90%"></div>
<div class="skel-line" style="width:75%"></div>
<div class="skel-line" style="width:85%"></div>
</div></div>
</main>
</div>
<div class="toast" id="toast"></div>
<dialog id="wlDlg"><div class="dlg-in"><button class="dlg-close" id="wlClose">×</button><h2>My Wordlist</h2><input class="wl-search" id="wlSearch" placeholder="Search…"><div id="wlList"></div></div></dialog>
<dialog id="rptDlg"><div class="dlg-in"><button class="dlg-close" id="rptClose">×</button><h2>Results Report</h2><div id="rptBody"></div><div class="rpt-btns"><button class="btn-mail" id="rptMail">✉️ Send Report to Teacher</button><button class="btn-copy" id="rptCopy">📋 Copy Report</button></div></div></dialog>
<script>
window.App={data:null,unitId:"1A",state:{ans:{},text:{},checked:{},notes:""},renderers:{},save:()=>{},wrap:t=>t,toast:()=>{}};
(function(){
const UNITS=[];
for(let u=1;u<=12;u++)["A","B","C","D","R"].forEach(l=>UNITS.push(u+l));
const STOP=new Set("the a an is are was were am be been and or but in on at to of for with by from it its he she they them we us you your i my me that this".split(" "));
const DEMO={unitId:"DEMO",unitNumber:0,lessonType:"demo",title:"Demo Lesson",dictionary:{"rely":{ipa:"/rɪˈlaɪ/",pos:"v",forms:["relies","relied","relying"],meaning:"to depend on someone or something",example:"You can rely on me."},"opportunity":{ipa:"/ˌɒpəˈtjuːnəti/",pos:"n",forms:["opportunities"],meaning:"a chance to do something",example:"This is a great opportunity."},"achieve":{ipa:"/əˈtʃiːv/",pos:"v",forms:["achieves","achieved","achieving"],meaning:"to succeed in doing something",example:"She achieved her goals."},"challenge":{ipa:"/ˈtʃælɪndʒ/",pos:"n",forms:["challenges"],meaning:"a difficult task",example:"It was a real challenge."},"improve":{ipa:"/ɪmˈpruːv/",pos:"v",forms:["improves","improved","improving"],meaning:"to make or become better",example:"I want to improve my English."},"confident":{ipa:"/ˈkɒnfɪdənt/",pos:"adj",forms:[],meaning:"feeling sure about yourself",example:"She feels more confident now."}},sections:[{id:"s1",title:"Reading Practice",pages:"1–2",group:"lesson",tip:"Read carefully and notice the highlighted phrases.",blocks:[{type:"reading",cards:[{subheading:"Paragraph A",text:"Many students rely on technology to improve their skills. This is a great opportunity to achieve more."},{subheading:"Paragraph B",text:"Facing a challenge can make you more confident."}],highlights:[{text:"rely on technology",color:"green"},{text:"great opportunity",color:"pink"}],legend:[{color:"green",label:"Useful phrase"},{color:"pink",label:"Key idea"}]},{type:"flexible_input",number:"1a",instruction:"Complete the sentences.",wordBox:["rely","opportunity","achieve"],items:[{q:"You can ___ on your friends for support.",answers:["rely"],hint:"depend"},{q:"This job is a fantastic ___.",answers:["opportunity"]},{q:"Hard work helps you ___ your goals.",answers:["achieve"]}]},{type:"true_false",number:"1b",instruction:"Are these statements true or false?",items:[{q:"Technology can help students improve.",answer:true,explanation:"Yes, as stated in the text."},{q:"Challenges always make people less confident.",answer:false,explanation:"The text says challenges can make you more confident."}]}]}]};
function $(id){return document.getElementById(id)}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function norm(s){return(s||"").toLowerCase().replace(/[^\w\s']/g,"").replace(/\s+/g," ").trim().replace(/n't/g," not").replace(/'re/g," are").replace(/'ve/g," have").replace(/'ll/g," will").replace(/'d/g," would").replace(/'m/g," am")}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
App.toast=toast;
function getUnit(){const p=new URLSearchParams(location.search);return(p.get("unit")||"1A").toUpperCase()}
function normalizeLessonData(raw){
if(!raw||typeof raw!=="object")raw={};
const d={unitId:raw.unitId||App.unitId,unitNumber:raw.unitNumber||0,lessonType:raw.lessonType||"",title:raw.title||"Lesson",dictionary:{},sections:[]};
const dict=raw.dictionary||raw.vocabulary||raw.glossary||raw.lexicon||{};
for(const[k,v]of Object.entries(dict)){if(!v)continue;d.dictionary[k]={ipa:v.ipa||"",pos:v.pos||"",forms:Array.isArray(v.forms)?v.forms:[],meaning:v.meaning||v.def||"",example:v.example||""}}
const secs=raw.sections||raw.pages||raw.parts||[];
secs.forEach((s,si)=>{
const sec={id:s.id||"sec"+si,title:s.title||"Section",pages:s.pages||"",group:s.group||"lesson",tip:s.tip||"",blocks:[]};
const blks=s.blocks||s.exercises||s.activities||s.tasks||[];
blks.forEach((b,bi)=>{

function buildDictIndex(dict){
const entries=[];
for(const[hw,v]of Object.entries(dict||{})){
entries.push({key:hw.toLowerCase(),hw,len:hw.length,data:v});
(v.forms||[]).forEach(f=>{if(f)entries.push({key:f.toLowerCase(),hw,len:f.length,data:v})});
}
entries.sort((a,b)=>b.len-a.len);

}
let dictIndex=[];
function wrapText(text){
if(!text)return"";
const parts=[];let i=0;const s=String(text);
while(i<s.length){
if(/\s/.test(s[i])){parts.push(s[i]);i++;continue}
let matched=false;
for(const e of dictIndex){
if(s.substring(i,i+e.len).toLowerCase()===e.key){
const before=i>0?s[i-1]:"";const after=s[i+e.len]||"";
if(/\w/.test(before)||/\w/.test(after))continue;
const word=s.substring(i,i+e.len);
parts.push(`<span class="dict-word" data-hw="${e.hw}">${word}</span>`);
i+=e.len;matched=true;break;
}
}
if(!matched){
let j=i;
while(j<s.length&&!/\s/.test(s[j]))j++;
const w=s.substring(i,j);
const low=w.toLowerCase().replace(/[^\w']/g,"");
if(low&&!STOP.has(low)&&dictIndex.some(e=>e.key===low)){
parts.push(`<span class="dict-word" data-hw="${w}">${w}</span>`);
}else parts.push(w);
i=j;
}
}
return parts.join("");
}

audio.onended=()=>{play.textContent="▶"};
ctrls.append(play,back,fwd,scrub,timeDisp,speed);card.appendChild(ctrls);card.appendChild(audio);wrap.appendChild(card);
if(b.transcript){
const tc=el("div","trans-card");
const th=el("div","trans-head");th.innerHTML=`Transcript <span style="margin-left:auto">▾</span>`;
th.onclick=()=>tc.classList.toggle("open");
const tb=el("div","trans-body");
(b.transcript||"").split("\n").forEach(line=>{
const p=el("p");
const ci=line.indexOf(":");
if(ci>0&&ci<30){p.innerHTML=`<span class="spk">${line.slice(0,ci)}</span>${wrapText(line.slice(ci))}`}
else p.innerHTML=wrapText(line);
tb.appendChild(p);
});
tc.append(th,tb);wrap.appendChild(tc);
}
return wrap;
}
function countedTypes(t){return["flexible_input","dropdown","true_false","writing_box","speaking","self_assessment"].includes(t)}
function updateProgress(){
let done=0,tot=0;
(App.data.sections||[]).forEach((sec,si)=>{
let secDone=true,secHas=false;
(sec.blocks||[]).forEach((b,bi)=>{
if(!countedTypes(b.type))return;
secHas=true;tot++;
const key=`${si}_${bi}`;
if(App.state.checked[key])done++;else secDone=false;
});
const link=document.querySelector(`[data-sec="${sec.id}"]`);
if(link){link.classList.toggle("done",secHas&&secDone)}
});
const pct=tot?Math.round(done/tot*100):0;
$("progPct").textContent=pct+"%";
$("progFill").style.width=pct+"%";
}
function renderLesson(data){
App.data=data;dictIndex=buildDictIndex(data.dictionary);
$("lessonTitle").textContent=data.title||"Lesson";
document.title=data.title||"Lesson";
const sel=$("unitSel");sel.innerHTML="";
UNITS.forEach(u=>{const o=el("option");o.value=u;o.textContent=u;if(u===App.unitId)o.selected=true;sel.appendChild(o)});
sel.onchange=()=>{location.href="lesson.html?unit="+sel.value};
const ls=$("lessonSecs"),fs=$("focusSecs");ls.innerHTML="";fs.innerHTML="";
data.sections.forEach((sec,si)=>{
const li=el("li");
const a=el("a");a.href="#"+sec.id;a.dataset.sec=sec.id;
const isFocus=sec.group==="focus";
const label=isFocus?String.fromCharCode(65+(si%26)):String(si+1);
a.innerHTML=`<span class="dot">${label}</span>${sec.title}`;
a.onclick=e=>{if(window.innerWidth<=768){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}};
li.appendChild(a);(isFocus?fs:ls).appendChild(li);
});
const content=$("content");content.className="card-inner";content.innerHTML="";
data.sections.forEach((sec,si)=>{
const secEl=el("section");secEl.id=sec.id;
if(sec.pages)secEl.appendChild(el("div","pages-pill","Pages "+sec.pages));
if(sec.tip){
const tip=el("div","tip-bar");tip.innerHTML=`✦ Tip <span class="chev">▾</span>`;
const body=el("div","tip-body");body.innerHTML=wrapText(sec.tip);
tip.onclick=()=>tip.classList.toggle("open");
secEl.append(tip,body);
}
secEl.appendChild(el("h2","sec-head",sec.title));
(sec.blocks||[]).forEach((b,bi)=>{
const key=`${si}_${bi}`;
let node=null;
if(b.type==="reading")node=renderReading(b);
else if(b.type==="grammar_box")node=renderGrammar(b);
else if(b.type==="flexible_input")node=renderGaps(b,"flexible_input",key);
else if(b.type==="dropdown")node=renderGaps(b,"dropdown",key);
else if(b.type==="true_false")node=renderTF(b,key);
else if(b.type==="writing_box")node=renderWriting(b,key);
else if(b.type==="speaking")node=renderSpeaking(b,key);
else if(b.type==="self_assessment")node=renderSA(b,key);
else if(b.type==="image")node=renderImage(b);
else if(b.type==="audio_player")node=renderAudio(b,key);
else if(App.renderers[b.type])node=App.renderers[b.type](b,{key});
if(node)secEl.appendChild(node);
});
content.appendChild(secEl);
});
const nextIdx=UNITS.indexOf(App.unitId)+1;
const nextU=nextIdx<UNITS.length?UNITS[nextIdx]:null;
const comp=el("div","complete-card");
comp.innerHTML=`<h3>Lesson complete</h3>`;
if(nextU){const btn=el("button","btn-next","Next lesson →");btn.onclick=()=>{location.href="lesson.html?unit="+nextU};comp.appendChild(btn)}
content.appendChild(comp);
updateProgress();
setupScrollSpy();
}
function setupScrollSpy(){
const links=[...document.querySelectorAll(".sec-list a")];
const secs=links.map(a=>document.getElementById(a.dataset.sec)).filter(Boolean);
function spy(){
let cur=null;
secs.forEach(s=>{if(s.getBoundingClientRect().top<120)cur=s});
links.forEach(a=>a.classList.toggle("active",cur&&a.dataset.sec===cur.id));
}
document.addEventListener("scroll",spy,{passive:true});spy();
}
function showFail(){
$("content").className="card-inner";
$("content").innerHTML=`<div class="fail-card"><h2>Could not load lesson</h2><p style="margin:.5rem 0;color:var(--muted);font-size:.9rem">Select a .json file or try the demo.</p><input type="file" id="filePick" accept=".json"><br><button id="demoBtn">Try demo</button></div>`;
$("filePick").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{renderLesson(normalizeLessonData(JSON.parse(r.result)))}catch(err){toast("Invalid JSON")}};r.readAsText(f)};
$("demoBtn").onclick=()=>{App.unitId="DEMO";App.state=loadState("DEMO");renderLesson(normalizeLessonData(DEMO))};
}
function openWordlist(){
const dlg=$("wlDlg");const list=$("wlList");
function draw(filter){
list.innerHTML="";
let wl=getWordlist();
if(filter)wl=wl.filter(w=>w.word.toLowerCase().includes(filter)||(w.meaning||"").toLowerCase().includes(filter));
if(!wl.length){list.innerHTML=`<p style="color:var(--muted);font-size:.9rem">No words saved yet.</p>`;return}
wl.forEach((w,i)=>{
const row=el("div","wl-item");
row.innerHTML=`<div><strong>${w.word}</strong> <span style="color:var(--muted);font-size:.8rem">${w.unit||""}</span><br><span style="font-size:.8rem">${w.meaning||""}</span></div>`;
const del=el("button","wl-del","Delete");
del.onclick=()=>{const full=getWordlist();const idx=full.findIndex(x=>x.word===w.word&&x.unit===w.unit);if(idx>=0){const removed=full.splice(idx,1)[0];setWordlist(full);draw($("wlSearch").value);toast("Deleted — Undo");
const t=$("toast");t.onclick=()=>{const cur=getWordlist();cur.push(removed);setWordlist(cur);draw($("wlSearch").value);t.onclick=null;toast("Restored")}}};
row.appendChild(del);list.appendChild(row);
});
}
$("wlSearch").oninput=()=>draw($("wlSearch").value);
draw("");dlg.showModal();
}
function openReport(){
const name=getName()||$("nameIn").value;
if(!name.trim()){$("nameIn").focus();$("nameIn").style.outline="2px solid #DC2626";toast("Please enter your name");setTimeout(()=>$("nameIn").style.outline="",2000);return}
let correct=0,total=0;
const breakdown=[];
(App.data.sections||[]).forEach((sec,si)=>{
(sec.blocks||[]).forEach((b,bi)=>{
const key=`${si}_${bi}`;
if(b.type==="flexible_input"||b.type==="dropdown"){
let ok=0,tot=0;
(b.items||[]).forEach((it,i)=>{
const inputs=document.querySelectorAll(`[data-key="${key}_${i}"]`);
inputs.forEach((inp,bli)=>{
tot++;total++;
const val=norm(inp.value);
const acc=(it.blanks&&it.blanks[bli]?it.blanks[bli]:it.answers||[]).map(norm);
if(acc.includes(val)&&val){ok++;correct++}
});
});
if(tot)breakdown.push({label:(b.number||"")+" "+(b.instruction||"Gaps").slice(0,40),ok,tot});
}else if(b.type==="true_false"){
let ok=0,tot=(b.items||[]).length;total+=tot;
(b.items||[]).forEach((it,i)=>{const val=App.state.ans[key+"_"+i];if(val!=null&&((val==="true")===!!it.answer)){ok++;correct++}});
if(tot)breakdown.push({label:(b.number||"")+" True/False",ok,tot});
}
});
});
const pct=total?Math.round(correct/total*100):0;
const words=getWordlist().filter(w=>w.unit===App.unitId);
let html=`<div class="rpt-sec"><strong>Student:</strong> ${name}</div><div class="rpt-sec"><strong>Lesson:</strong> ${App.data.title} (${App.unitId})</div><div class="rpt-sec"><strong>Score:</strong> ${correct}/${total} (${pct}%)</div>`;
if(breakdown.length){html+=`<div class="rpt-sec"><strong>Breakdown:</strong><ul style="margin:.3rem 0 0 1.2rem">`;breakdown.forEach(b=>{html+=`<li>${b.label}: ${b.ok}/${b.tot}</li>`});html+=`</ul></div>`}
if(words.length){html+=`<div class="rpt-sec"><strong>Saved words:</strong> ${words.map(w=>w.word).join(", ")}</div>`}
let texts=[];
Object.entries(App.state.text||{}).forEach(([k,v])=>{if(v&&v.trim())texts.push(v.trim())});
if(texts.length)html+=`<div class="rpt-sec"><strong>Writing / Notes:</strong><br>${texts.map(t=>`<p style="margin:.3rem 0;font-size:.85rem">${t.slice(0,200)}${t.length>200?"…":""}</p>`).join("")}</div>`;
$("rptBody").innerHTML=html;
$("rptDlg").showModal();
const bodyTxt=`Student: ${name}\nLesson: ${App.data.title} (${App.unitId})\nScore: ${correct}/${total} (${pct}%)\n`+breakdown.map(b=>`${b.label}: ${b.ok}/${b.tot}`).join("\n")+(words.length?"\nWords: "+words.map(w=>w.word).join(", "):"")+(texts.length?"\n\nWriting:\n"+texts.join("\n\n"):"");
$("rptMail").onclick=()=>{location.href=`mailto:n.tsntsdz@gmail.com?subject=${encodeURIComponent("Results: "+App.data.title+" – "+name)}&body=${encodeURIComponent(bodyTxt)}`};
$("rptCopy").onclick=()=>{navigator.clipboard.writeText(bodyTxt).then(()=>toast("Copied!")).catch(()=>toast("Copy failed"))};
}
function init(){
App.unitId=getUnit();
App.state=loadState(App.unitId);
$("nameIn").value=getName();
$("nameIn").oninput=()=>{setName($("nameIn").value);saveState()};
$("burger").onclick=()=>{$("sidebar").classList.add("open");$("overlay").classList.add("show")};
$("overlay").onclick=()=>{$("sidebar").classList.remove("open");$("overlay").classList.remove("show")};
$("wordlistBtn").onclick=openWordlist;
$("wlClose").onclick=()=>$("wlDlg").close();
$("reportBtn").onclick=openReport;
$("rptClose").onclick=()=>$("rptDlg").close();
$("resetBtn").onclick=()=>{
const prev=JSON.parse(JSON.stringify(App.state));
App.state={ans:{},text:{},checked:{},notes:App.state.notes||""};saveState();
renderLesson(App.data);toast("Progress reset — Undo");
$("toast").onclick=()=>{App.state=prev;saveState();renderLesson(App.data);$("toast").onclick=null;toast("Restored")};
};
const s=el("script");s.src="extras.js";
s.onload=s.onerror=loadData;
document.head.appendChild(s);
}
function loadData(){
if(location.protocol==="file:"){showFail();return}
fetch("data/"+App.unitId+".json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{renderLesson(normalizeLessonData(j))}).catch(()=>showFail());
}
init();
})();
</script>
</body>
</html>
