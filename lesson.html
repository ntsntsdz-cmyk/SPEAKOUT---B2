<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speakout B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--accent:#4F46E5;--tint:#EEF2FF;--text:#0F172A;--muted:#64748B;--green:#BBF7D0;--greenT:#166534;--pink:#FBCFE8;--pinkT:#9D174D;--border:#E2E8F0;--shadow:0 1px 3px rgba(15,23,42,.08);--radius:12px;--side:280px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
h1,h2,h3,.heading{font-family:"Plus Jakarta Sans",sans-serif}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.wrap{display:flex;min-height:100vh}
.sidebar{width:var(--side);background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px;flex-shrink:0;z-index:40;transition:transform .25s}
.sidebar a.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);margin-bottom:12px}
.sidebar a.back:hover{color:var(--accent)}
.side-title{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.3}
.unit-switch{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.unit-switch select{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px}
.name-card{background:var(--tint);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.name-card label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.name-card input{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.prog-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.prog-pill{font-size:12px;font-weight:600;background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px}
.prog-bar{flex:1;height:4px;background:#E0E7FF;border-radius:2px;overflow:hidden}
.prog-bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.saved{font-size:11px;color:var(--muted);margin-top:4px}
.side-btns{display:flex;gap:8px;margin-bottom:14px}
.side-btns button{flex:1;padding:8px;font-size:13px;font-weight:500;border:1px solid var(--border);border-radius:8px;background:#fff;min-height:44px}
.side-btns button:hover{background:var(--tint)}
.side-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.sec-nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--text);margin-bottom:2px}
.sec-nav a:hover{background:var(--tint)}
.sec-nav a.active{background:var(--tint);color:var(--accent);font-weight:600}
.sec-nav .num{width:22px;height:22px;border-radius:50%;background:#E0E7FF;color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-nav a.done .num{background:var(--green);color:var(--greenT)}
.sec-nav a.done .num::after{content:"✓"}
.sec-nav a.done .num span{display:none}
.focus-nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;margin-bottom:2px}
.focus-nav .let{width:22px;height:22px;border-radius:50%;background:#FCE7F3;color:var(--pinkT);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.btn-report{width:100%;padding:12px;background:var(--accent);color:#fff;font-weight:600;border-radius:10px;font-size:14px;min-height:44px}
.btn-report:hover{filter:brightness(1.05)}
.btn-reset{width:100%;margin-top:8px;font-size:12px;color:var(--muted);padding:8px;min-height:44px}
.btn-reset:hover{color:#DC2626}
.burger{display:none;position:fixed;top:12px;left:12px;z-index:50;width:44px;height:44px;background:#fff;border-radius:10px;box-shadow:var(--shadow);align-items:center;justify-content:center;font-size:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:35}
main{flex:1;padding:24px 16px 80px;display:flex;justify-content:center}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);max-width:860px;width:100%;padding:28px 32px;position:relative;border-left:4px solid transparent;background-image:linear-gradient(#fff,#fff),linear-gradient(180deg,#4F46E5,#7C3AED);background-origin:border-box;background-clip:padding-box,border-box}
.skel{padding:28px 32px}
.skel .s{background:linear-gradient(90deg,#E2E8F0 25%,#F1F5F9 50%,#E2E8F0 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:16px;margin-bottom:12px}
.skel .s.w60{width:60%}.skel .s.w40{width:40%}.skel .s.h24{height:24px}.skel .s.h80{height:80px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fail-card{text-align:center;padding:40px 24px}
.fail-card h2{font-size:18px;margin-bottom:8px}
.fail-card p{color:var(--muted);font-size:14px;margin-bottom:16px}
.fail-card input[type=file]{margin:12px auto;display:block}
.fail-card .btn{display:inline-block;margin-top:8px;padding:10px 20px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;min-height:44px}
.section{margin-bottom:36px;scroll-margin-top:24px}
.pages-pill{display:inline-block;font-size:11px;font-weight:600;background:#F3E8FF;color:#6B21A8;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.tip-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;font-size:13px;color:#92400E;cursor:pointer;margin-bottom:10px;min-height:44px}
.tip-bar .chev{margin-left:auto;transition:transform .2s}
.tip-bar.open .chev{transform:rotate(180deg)}
.tip-body{display:none;padding:8px 12px;font-size:13px;color:#78350F;background:#FFFBEB;border-radius:0 0 8px 8px;margin-top:-8px;margin-bottom:10px}
.tip-bar.open+.tip-body{display:block}
.sec-head{font-size:20px;font-weight:700;margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid #E0E7FF}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legend span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.legend .g{background:var(--green);color:var(--greenT)}.legend .p{background:var(--pink);color:var(--pinkT)}
.ex{background:#FAFBFF;border:1px solid var(--border);border-radius:var(--radius);margin:16px 0;overflow:hidden}
.ex-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--tint);border-bottom:1px solid #E0E7FF}
.ex-num{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-inst{font-weight:600;font-size:14px;flex:1;padding-top:3px}
.ex-body{padding:14px}
.mini-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sub-badge{display:inline-block;font-size:12px;font-weight:700;background:#E0E7FF;color:var(--accent);padding:2px 8px;border-radius:6px;margin-bottom:6px}
.hl-g{background:var(--green);color:var(--greenT);padding:1px 5px;border-radius:4px;font-weight:600}
.hl-p{background:var(--pink);color:var(--pinkT);padding:1px 5px;border-radius:4px;font-weight:600}
.rule-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rule-label{display:inline-block;font-size:11px;font-weight:700;background:#E0E7FF;color:var(--accent);padding:2px 8px;border-radius:6px;margin-bottom:6px}
.rule-ex{margin-top:8px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--tint);font-size:13px;border-radius:0 6px 6px 0}
.vt-wrap{overflow-x:auto}
.vt{width:100%;border-collapse:collapse;font-size:13px;min-width:400px}
.vt th{text-align:left;padding:8px 10px;background:var(--tint);font-weight:600;border-bottom:2px solid #E0E7FF}
.vt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.vt .blur{filter:blur(5px);cursor:pointer;user-select:none}
.vt-toggle{margin-bottom:10px;font-size:13px;color:var(--accent);font-weight:500;min-height:44px;padding:6px 0}
.gap-in{display:inline-block;min-width:115px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px;vertical-align:baseline;background:#fff}
.gap-in.ok{border-color:#16A34A;background:#F0FDF4}
.gap-in.bad{border-color:#DC2626;background:#FEF2F2}
.gap-sel{display:inline-block;min-width:115px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:14px;vertical-align:baseline;background:#fff}
.gap-sel.ok{border-color:#16A34A;background:#F0FDF4}
.gap-sel.bad{border-color:#DC2626;background:#FEF2F2}
.hint-tag{font-size:11px;color:var(--muted);margin-left:4px}
.wordbox{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.wordbox span{padding:5px 12px;background:var(--tint);border:1px solid #C7D2FE;border-radius:999px;font-size:13px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.wordbox span.used{opacity:.4;pointer-events:none}
.mark{font-weight:700;margin-left:4px}
.mark.ok{color:#16A34A}.mark.bad{color:#DC2626}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn-check{padding:8px 16px;background:var(--accent);color:#fff;font-weight:600;border-radius:8px;font-size:13px;min-height:44px}
.btn-quiet{padding:8px 12px;color:var(--muted);font-size:13px;min-height:44px}
.btn-quiet:hover{color:var(--accent)}
.score-line{font-size:13px;font-weight:600;margin-left:auto}
.hint-tog,.why-tog{font-size:12px;color:var(--accent);cursor:pointer;margin-top:4px;display:inline-block}
.hint-body,.why-body{display:none;font-size:13px;color:var(--muted);padding:6px 0;border-left:2px solid #C7D2FE;padding-left:10px;margin-top:4px}
.hint-body.show,.why-body.show{display:block}
.tf-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tf-q{flex:1;font-size:14px;min-width:140px}
.tf-btns{display:flex;gap:6px}
.tf-btns button{padding:6px 14px;border:1px solid var(--border);border-radius:999px;font-size:13px;min-height:36px;background:#fff}
.tf-btns button.on-t{background:#F0FDF4;border-color:#16A34A;color:#16A34A;font-weight:600}
.tf-btns button.on-f{background:#FEF2F2;border-color:#DC2626;color:#DC2626;font-weight:600}
.tf-exp{width:100%;margin-top:6px}
.tf-exp textarea{width:100%;min-height:40px;padding:8px;border:1px solid var(--border);border-radius:8px;resize:vertical;font-size:13px}
.tf-exp-tog{font-size:12px;color:var(--muted);cursor:pointer}
.wb-area{width:100%;min-height:100px;padding:12px;border:1px solid var(--border);border-radius:10px;resize:vertical;font-size:14px;line-height:1.6}
.wb-meta{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.wc{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#F1F5F9;color:var(--muted)}
.wc.ok{background:var(--green);color:var(--greenT)}
.tv-chips{display:flex;flex-wrap:wrap;gap:6px}
.tv-chips span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tint);border:1px solid #C7D2FE}
.tv-chips span.hit{background:var(--green);border-color:#86EFAC;color:var(--greenT)}
.sp-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sp-tog{width:100%;text-align:left;padding:12px 14px;font-weight:600;font-size:14px;background:var(--tint);display:flex;align-items:center;min-height:44px}
.sp-tog .chev{margin-left:auto;transition:transform .2s}
.sp-card.open .sp-tog .chev{transform:rotate(180deg)}
.sp-body{display:none;padding:14px}
.sp-card.open .sp-body{display:block}
.sp-q{margin:8px 0;font-size:14px;padding-left:8px}
.sp-notes{width:100%;min-height:60px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-top:10px;font-size:13px;resize:vertical}
.sa-list{list-style:none}
.sa-list li{padding:8px 0;display:flex;align-items:flex-start;gap:10px;font-size:14px}
.sa-list input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--accent)}
.img-block{margin:12px 0;text-align:center}
.img-block img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.img-miss{border:2px dashed #CBD5E1;border-radius:10px;padding:24px;color:var(--muted);font-size:13px}
.img-cap{font-size:12px;color:var(--muted);margin-top:6px}
.aud-card{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:12px 0}
.aud-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aud-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aud-btn.sm{width:36px;height:36px;background:#E0E7FF;color:var(--accent);font-size:12px}
.aud-scrub{flex:1;min-width:80px;height:4px;accent-color:var(--accent)}
.aud-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.aud-spd{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px}
.aud-miss{color:var(--muted);font-size:13px;padding:8px 0}
.tr-card{border:2px solid #C7D2FE;border-radius:10px;margin-top:10px;overflow:hidden}
.tr-tog{width:100%;text-align:left;padding:10px 14px;font-weight:700;font-size:13px;color:var(--accent);display:flex;align-items:center;min-height:44px}
.tr-tog .chev{margin-left:auto;transition:transform .2s}
.tr-card.open .tr-tog .chev{transform:rotate(180deg)}
.tr-body{display:none;padding:12px 14px;font-size:13px;line-height:1.7}
.tr-card.open .tr-body{display:block}
.tr-body .spk{font-weight:700}
.done-card{text-align:center;padding:28px;background:linear-gradient(135deg,#EEF2FF,#F5F3FF);border-radius:var(--radius);margin-top:24px}
.done-card h3{font-size:18px;margin-bottom:8px}
.done-card .btn-next{display:inline-block;margin-top:12px;padding:12px 24px;background:var(--accent);color:#fff;font-weight:600;border-radius:10px;min-height:44px}
.dict-pop{position:fixed;z-index:100;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,.18);padding:14px;width:280px;max-width:calc(100vw - 24px);border:1px solid var(--border)}
.dict-pop .hw{font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
.dict-pop .spb{width:32px;height:32px;border-radius:50%;background:var(--tint);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.dict-pop .ipa{font-size:13px;color:var(--muted);margin:4px 0}
.dict-pop .ipa b{color:var(--pinkT);font-weight:700}
.dict-pop .pos{display:inline-block;font-size:11px;font-weight:600;background:#E0E7FF;color:var(--accent);padding:1px 7px;border-radius:4px;margin-right:6px}
.dict-pop .mean{font-size:13px;margin:6px 0}
.dict-pop .ex{font-size:12px;font-style:italic;color:var(--muted);border-left:2px solid #C7D2FE;padding-left:8px;margin:6px 0;background:none;border-radius:0}
.dict-pop .save{width:100%;padding:8px;margin-top:8px;background:var(--accent);color:#fff;font-weight:600;border-radius:8px;font-size:13px;min-height:40px}
.dict-pop .save.saved{background:#16A34A}
.dict-pop .x{position:absolute;top:8px;right:10px;font-size:18px;color:var(--muted);width:28px;height:28px}
.dw{cursor:pointer;border-bottom:1px dotted #A5B4FC}
.dw:hover{background:#E0E7FF}
dialog{border:none;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);box-shadow:0 20px 50px rgba(15,23,42,.2)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dlg-h h2{font-size:16px}
.dlg-x{font-size:20px;color:var(--muted);width:36px;height:36px}
.dlg-b{padding:16px 20px;max-height:60vh;overflow-y:auto}
.dlg-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.wl-search{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
.wl-item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.wl-item .info{flex:1}
.wl-item .w{font-weight:700;color:var(--accent)}
.wl-item .meta{font-size:12px;color:var(--muted)}
.wl-item .del{color:#DC2626;font-size:13px;min-height:36px;padding:4px 8px}
.wl-empty{text-align:center;color:var(--muted);padding:24px;font-size:14px}
.rep-row{margin-bottom:10px;font-size:14px}
.rep-row b{font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:768px){
.burger{display:flex}
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.1)}
.sidebar.open{transform:translateX(0)}
.overlay.show{display:block}
main{padding:16px 12px 60px}
.card{padding:20px 16px}
}
</style>
</head>
<body>
<button class="burger" id="burger" aria-label="Menu">☰</button>
<div class="overlay" id="overlay"></div>
<div class="wrap">
<aside class="sidebar" id="sidebar">
<a class="back" href="index.html">← Main page</a>
<div class="side-title" id="sideTitle">Loading…</div>
<div class="unit-switch">
<button id="prevUnit" aria-label="Previous">‹</button>
<select id="unitSelect" aria-label="Lesson"></select>
<button id="nextUnit" aria-label="Next">›</button>
</div>
<div class="name-card">
<label for="stuName">YOUR NAME</label>
<input id="stuName" type="text" placeholder="Type full name" autocomplete="name">
<div class="prog-row"><span class="prog-pill" id="pctPill">0%</span><div class="prog-bar"><i id="pctBar"></i></div></div>
<div class="saved" id="savedTxt"></div>
</div>
<div class="side-btns">
<button id="notesBtn">📝 Notes</button>
<button id="wlBtn">📖 My Wordlist</button>
</div>
<div class="side-label">LESSON</div>
<nav class="sec-nav" id="lessonNav"></nav>
<div class="side-label">FOCUS</div>
<nav class="focus-nav" id="focusNav"></nav>
<div class="side-foot">
<button class="btn-report" id="reportBtn">📊 Results Report</button>
<button class="btn-reset" id="resetBtn">Reset progress</button>
</div>
</aside>
<main>
<div class="card" id="mainCard">
<div class="skel" id="skel">
<div class="s h24 w60"></div><div class="s w40"></div><div class="s"></div><div class="s"></div><div class="s h80"></div><div class="s"></div><div class="s w60"></div>
</div>
<div id="content" style="display:none"></div>
</div>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="wlDlg">
<div class="dlg-h"><h2>My Wordlist</h2><button class="dlg-x" id="wlClose" aria-label="Close">×</button></div>
<div class="dlg-b">
<input class="wl-search" id="wlSearch" type="search" placeholder="Search words…">
<select id="wlFilter" style="margin-bottom:10px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px"><option value="">All units</option></select>
<div id="wlList"></div>
</div>
</dialog>
<dialog id="repDlg">
<div class="dlg-h"><h2>Results Report</h2><button class="dlg-x" id="repClose" aria-label="Close">×</button></div>
<div class="dlg-b" id="repBody"></div>

i+=ph.length;matched=true;break;

var list=getWL();var filt=$("wlFilter");
var units={};list.forEach(function(w){units[w.unit]=1});
filt.innerHTML='<option value="">All units</option>';
Object.keys(units).sort().forEach(function(u){var o=document.createElement("option");o.value=u;o.textContent=u;filt.appendChild(o)});
function draw(){
var q=($("wlSearch").value||"").toLowerCase();var u=filt.value;
var items=list.filter(function(w){return(!q||w.word.indexOf(q)>=0||(w.meaning||"").toLowerCase().indexOf(q)>=0)&&(!u||w.unit===u)});
var box=$("wlList");box.innerHTML="";
if(!items.length){box.innerHTML='<div class="wl-empty">No saved words yet</div>';return}
items.forEach(function(w,idx){
var row=document.createElement("div");row.className="wl-item";
row.innerHTML='<div class="info"><div class="w">'+w.word+'</div><div class="meta">'+(w.ipa||"")+" · "+(w.pos||"")+" · "+w.unit+'</div><div style="font-size:13px">'+(w.meaning||"")+"</div></div>";
var del=document.createElement("button");del.className="del";del.textContent="Delete";
del.onclick=function(){
var removed=list.splice(list.indexOf(w),1)[0];setWL(list);draw();
toast("Deleted · Undo");
var t=$("toast");t.style.pointerEvents="auto";t.onclick=function(){list.push(removed);setWL(list);draw();t.style.pointerEvents="none";t.onclick=null;toast("Restored")};
};
row.appendChild(del);box.appendChild(row);
});
}
$("wlSearch").oninput=draw;filt.onchange=draw;draw();
$("wlDlg").showModal();
}
$("reportBtn").onclick=function(){openReport()};
$("repClose").onclick=function(){$("repDlg").close()};
function openReport(){
var name=getName();
var body=$("repBody");
var lines=[];
lines.push("Speakout B2 — "+(App.data.title||App.unitId));
lines.push("Student: "+(name||"(no name)"));
lines.push("Score: "+App.state.meta.score+"% · Progress: "+App.state.meta.pct+"%");
lines.push("");
var secs=App.data.sections||[];
secs.forEach(function(sec){
sec.blocks.forEach(function(blk,bi){
var key=sec.id+"_"+bi;var t=blk.type;
if(t==="flexible_input"||t==="dropdown"){
if(!App.state.checked[key])return;
var ok=0,tot=0;
(blk.items||[]).forEach(function(it,ii){
var blanks=it.blanks&&it.blanks.length?it.blanks:[(it.answers||[])];
blanks.forEach(function(ba,gi){tot++;if(isCorrect(App.state.ans[key+"_"+ii+"_"+gi]||"",ba.length?ba:it.answers))ok++});
});
lines.push("Ex "+(blk.number||bi+1)+": "+ok+"/"+tot);
}else if(t==="true_false"){
if(!App.state.checked[key])return;
var ok=0,tot=(blk.items||[]).length;
(blk.items||[]).forEach(function(it,ii){if(App.state.ans[key+"_"+ii]===String(it.answer))ok++});
lines.push("Ex "+(blk.number||bi+1)+": "+ok+"/"+tot);
}else if(t==="writing_box"&&App.state.text[key]){lines.push("Writing: "+App.state.text[key].slice(0,200)+(App.state.text[key].length>200?"…":""))}
else if(t==="speaking"&&App.state.text[key]){lines.push("Speaking notes: "+App.state.text[key].slice(0,200))}
});
});
var wl=getWL().filter(function(w){return w.unit===App.unitId});
if(wl.length){lines.push("");lines.push("Saved words ("+wl.length+"): "+wl.map(function(w){return w.word}).join(", "))}
body.innerHTML="";
lines.forEach(function(l){var d=document.createElement("div");d.className="rep-row";d.textContent=l;body.appendChild(d)});
body._full=lines.join("\n");
$("repDlg").showModal();
}
$("repCopy").onclick=function(){
var t=$("repBody")._full||"";
if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Report copied")}).catch(function(){toast("Copy failed")});
else toast("Copy failed");
};
$("repSend").onclick=function(){
var name=getName();
if(!name.trim()){
$("repDlg").close();
var inp=$("stuName");inp.focus();inp.style.boxShadow="0 0 0 3px #FCA5A5";
var msg=document.createElement("div");msg.style.color="#DC2626";msg.style.fontSize="12px";msg.style.marginTop="4px";msg.id="nameWarn";msg.textContent="Please enter your name";
if(!$("nameWarn"))inp.parentNode.appendChild(msg);
setTimeout(function(){inp.style.boxShadow="";var w=$("nameWarn");if(w)w.remove()},4000);
return;
}
var full=$("repBody")._full||"";
var subj="Speakout B2 Report — "+App.unitId+" — "+name;
var body=full;
if(body.length>1500){
if(navigator.clipboard)navigator.clipboard.writeText(full);
body=full.slice(0,1400)+"\n\n[Report truncated — full report copied to clipboard. Please paste it here.]";
toast("Report copied. Paste it into the email.");
}
window.location.href="mailto:n.tsntsdz@gmail.com?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
};
function start(){
var params=new URLSearchParams(location.search);
var uid=(params.get("unit")||"1A").toUpperCase();
if(UNITS.indexOf(uid)<0)uid="1A";
loadLesson(uid);
}
var s=document.createElement("script");s.src="extras.js";
s.onload=function(){start()};
s.onerror=function(){start()};
document.head.appendChild(s);
})();
</script>
</body>
